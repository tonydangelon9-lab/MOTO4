function calcular(d, V, permit){

  var ok={}; if(permit) permit.forEach(function(c){ ok[c]=1; });
  var notas=permit ? todasV.filter(function(x){ return ok[x.colete]; }) : todasV;
  var fora=permit ? todasV.filter(function(x){ return !ok[x.colete]; }) : [];
  var fic={}; (d.fichas||[]).forEach(function(p){ fic[p.colete]=p; });
  (d.ranking||[]).forEach(function(p){ if(!fic[p.colete]) fic[p.colete]={colete:p.colete,nome:p.nome,idade:p.idade,uf:p.uf}; });
  var col={}; notas.forEach(function(x){ (col[x.colete]=col[x.colete]||[]).push(x); });
  var tanda = V.s.length===1 ? V.s[0] : null;
  var tempos={}, melhor=null, ilegiveis=[];
  if(tanda){ (d.tempos||[]).forEach(function(t){ if(t.saida!==tanda) return; if(permit && !ok[t.colete]) return; var v=seg(t.volta); if(v){ tempos[t.colete]={txt:t.volta, v:v}; if(melhor===null||v<melhor) melhor=v; } else ilegiveis.push("#"+t.colete+" «"+t.volta+"»"); }); }
  var aj={}; if(tanda){ (d.ajustes||[]).forEach(function(a){ if(a.saida===tanda) (aj[a.colete]=aj[a.colete]||[]).push(a); }); }
  var lista=Object.keys(col).map(function(k){
    var c=Number(k), ev=col[k], base=media(ev.map(avg10));
    var bon = 0;
    var soma = (aj[c]||[]).reduce(function(p,a){ return p+a.valor; },0);
    var juizes={}; ev.forEach(function(x){ juizes[x.juiz]=1; });
    var crit=[]; for(var i=0;i<10;i++) crit.push(media(ev.map(function(x){ return x.notas[i]; })));
    return {c:c, f:fic[c]||{nome:"#"+c}, ev:ev, base:base, bon:bon, aj:aj[c]||[], soma:soma, total:base+bon+soma, nj:Object.keys(juizes).length,
            si:ev.filter(function(x){ return /^Sim/i.test(x.rec); }).length, crit:crit, tempo:tempos[c]||null};
  });
  var rd=function(x){ return Math.round(x*1000); };
  lista.sort(function(a,b){ return (rd(b.total)-rd(a.total)) || (b.si-a.si) || (b.nj-a.nj); });
  var empate = false;
  if(V.corte && lista.length>V.corte){ var a=lista[V.corte-1], b=lista[V.corte]; empate = rd(a.total)===rd(b.total) && a.si===b.si && a.nj===b.nj; }
  var foraCol={}; fora.forEach(function(x){ foraCol[x.colete]=(foraCol[x.colete]||0)+1; });
  return {lista:lista, notas:notas, tanda:tanda, fora:foraCol, ilegiveis:ilegiveis, empate:empate};
}

function congelados(d, V){ var c=d.clasificados||{}; var l=c[V.id]; return (l && l.length) ? l : null; }
function clasificados(d, V){
  var cg=congelados(d, V); if(cg) return cg;
  if(V.id==="3") return calcular(d, VISTAS[0]).lista.slice(0,12).map(function(x){ return x.c; });
  if(V.id==="4") return calcular(d, VISTAS[1], clasificados(d, VISTAS[1])).lista.slice(0,7).map(function(x){ return x.c; });
  if(V.id==="5") return null;
  return (d.fichas||[]).map(function(p){ return p.colete; });
}

function pintarSeg(d){
  var sg=$("seg"); sg.innerHTML="";
  VISTAS.forEach(function(V){
    var b=el("button"); b.type="button"; b.setAttribute("aria-pressed", vista===V.id?"true":"false");
    b.appendChild(document.createTextNode(V.t)); b.appendChild(el("small",null,V.sub));
    b.addEventListener("click", function(){ vista=V.id; abiertos={}; pintar(ultimo); });
    sg.appendChild(b);
  });
}

function pintar(d){
  ultimo = d;
  var todas = d.notas||[];
  if(!vista){ vista = todas.some(function(x){ return x.saida===5; }) ? "5" : (todas.some(function(x){ return x.saida===4; }) ? "4" : (todas.some(function(x){ return x.saida===3; }) ? "3" : "c")); }
  var V = VISTAS.filter(function(v){ return v.id===vista; })[0];
  pintarSeg(d);
  var esperados = clasificados(d, V);
  var sigCg = V.sig ? congelados(d, VISTAS.filter(function(v){ return v.id===V.sig; })[0]) : null;
  V = Object.assign({}, V, {corte: sigCg ? sigCg.length : V.corte});
  var sinLista5 = V.id==="5" && !congelados(d, V);
  if(sinLista5) V = Object.assign({}, V, {corte: 0});
  var R = calcular(d, V, (V.id==="c" || !esperados) ? null : esperados);
  $("st").textContent = "Actualizado " + d.hora + " · " + todas.length + " notas en total";
  var jz=$("jz"); jz.innerHTML="";
  (d.juizes||[]).forEach(function(n){
    var mine = todas.filter(function(x){ return x.juiz===n; });
    var por=[0,0,0,0,0]; mine.forEach(function(x){ if(x.saida>=1&&x.saida<=5) por[x.saida-1]++; });
    var esta = R.notas.filter(function(x){ return x.juiz===n; }).length;
    var c=el("div", esta?"":"cero"); c.appendChild(el("b",null,n)); c.appendChild(el("em",null,String(esta)));
    c.appendChild(el("small",null,"1ª "+por[0]+" · 2ª "+por[1]+" · 3ª "+por[2]+" · 4ª "+por[3]+" · 5ª "+por[4])); jz.appendChild(c);
  });
  $("lRk").textContent = V.id==="c" ? "Clasificación 1ª + 2ª · toca un piloto para ver quién puso cada nota" : (V.t+" · desde cero · toca un piloto para ver el detalle");
  if(V.id!=="c" && !congelados(d, V)) $("lRk").textContent += " · lista de clasificados PROVISORIA (calculada, sin confirmar)";
  var box=$("rk"); box.innerHTML="";
  if(sinLista5) box.appendChild(el("p","al","⚠ Lista de la 5ª sin congelar: los cupos todavía no son válidos."));
  if(R.empate) box.appendChild(el("p","al","⚠ Empate en el corte (misma nota, mismos «sí» y mismos jueces): decide Antonio."));
  if(R.ilegiveis.length) box.appendChild(el("p","al","⚠ Tiempo que no se pudo leer: "+R.ilegiveis.join(", ")+". Revisa la pestaña Tempos."));
  var fk=Object.keys(R.fora); if(fk.length) box.appendChild(el("p","al","⚠ Notas de pilotos no clasificados para esta tanda (revisar, no cuentan): "+fk.map(function(c){ return "#"+c+" ("+R.fora[c]+")"; }).join(", ")+"."));
  if(!R.lista.length) box.appendChild(el("p","muted","Todavía no hay notas en esta tanda."));
  R.lista.forEach(function(p, i){
    var it=el("div","it"+(i<V.corte?" top":"")+(i===V.corte-1&&R.lista.length>V.corte?" corte":""));
    var b=el("button"); b.type="button"; b.setAttribute("aria-expanded", abiertos[p.c]?"true":"false");
    b.appendChild(el("span","ps",(i+1)+"º")); b.appendChild(el("span","nu",String(p.c)));
    var tx=el("span","tx"); tx.appendChild(el("b",null,p.f.nome));
    var ln=[p.f.idade?p.f.idade+" años":"", p.f.uf, p.ev.length+" notas", p.nj+" jueces", p.si+" sí"];
    if(R.tanda) ln.unshift("base "+fmt(p.base));
    tx.appendChild(el("small",null,ln.filter(Boolean).join(" · ")));
    if(i<V.corte) tx.appendChild(el("span","tag ok",V.tagCorte));
    if(p.bon) tx.appendChild(el("span","tag up","+1 mejor vuelta"+(p.tempo?" "+p.tempo.txt:"")));
    p.aj.forEach(function(a){ tx.appendChild(el("span","tag "+(a.valor<0?"dn":"up"),(a.valor>0?"+":"")+String(a.valor).replace(".",",")+" "+(a.motivo||"ajuste"))); });
    b.appendChild(tx); b.appendChild(el("span","nt",fmt(p.total)));
    it.appendChild(b);
    var dt=el("div","dt"); dt.hidden=!abiertos[p.c];
    if(abiertos[p.c]) detalhe(dt, p, d.juizes||[], R.tanda);
    b.addEventListener("click", function(){ abiertos[p.c]=!abiertos[p.c]; b.setAttribute("aria-expanded", abiertos[p.c]?"true":"false");
      dt.hidden=!abiertos[p.c]; dt.innerHTML=""; if(abiertos[p.c]) detalhe(dt, p, d.juizes||[], R.tanda); });
    it.appendChild(dt); box.appendChild(it);
  });
  $("leg").textContent = V.id==="c" ? "Nota = promedio de las notas válidas de la 1ª y 2ª salida (los 10 criterios, mismo peso). Pasan a la 3ª los 12 primeros." :
    "Nota de la tanda = promedio de los jueces en esta tanda + 1 a la mejor vuelta (la marcas tú) − caídas (−1 en la 3ª; −2 desde la 4ª). Empate: más «sí», después más jueces.";
  var com = {}; R.lista.forEach(function(p){ com[p.c]=1; });
  var falt = (esperados||[]).filter(function(c){ return !com[c]; });
  var fic={}; (d.fichas||[]).forEach(function(p){ fic[p.colete]=p; });
  var sn=$("sn"); sn.innerHTML=""; $("snBox").hidden=!falt.length;
  $("lSn").textContent = V.id==="c" ? "Sin notas todavía" : "Clasificados sin notas en esta tanda";
  falt.forEach(function(c){ sn.appendChild(el("span",null,"#"+c+" "+String((fic[c]||{}).nome||"").split(" ")[0])); });
  $("app").hidden=false;
}

function detalhe(dt, p, juizes, tanda){
  if(tanda) controles(dt, p, tanda);
  if(p.tempo) dt.appendChild(el("div","sh","Mejor vuelta en esta tanda: "+p.tempo.txt+(p.bon?" · la más rápida (+1)":"")));
  dt.appendChild(el("div","sh","Promedio por criterio"));
  var cg=el("div","cg");
  CRIT.forEach(function(c,i){ var x=el("div"); x.appendChild(el("small",null,(i+1)+". "+c)); x.appendChild(el("b",null,f1(p.crit[i]))); cg.appendChild(x); });
  dt.appendChild(cg);
  var mine = p.ev.slice();
  var ord = function(n){ var k=juizes.indexOf(n); return k<0?99:k; };
  mine.sort(function(a,b){ return (a.saida-b.saida) || (ord(a.juiz)-ord(b.juiz)); });
  var sAtual = 0;
  mine.forEach(function(x){
    if(x.saida!==sAtual){ sAtual=x.saida; dt.appendChild(el("div","sh",x.saida+"ª salida"));
      var hn=el("div","ns h"); for(var k=1;k<=10;k++) hn.appendChild(el("i",null,String(k))); dt.appendChild(hn); }
    var ev=el("div","ev"), hd=el("div","hd");
    var esq=el("div"); esq.appendChild(el("b",null,x.juiz)); esq.appendChild(document.createTextNode(" ")); esq.appendChild(el("span",null,hhmm(x.hora)));
    var dir=el("div"); var r=rec(x.rec); dir.appendChild(el("span","rc "+r[1],r[0])); dir.appendChild(document.createTextNode(" ")); dir.appendChild(el("em",null,f1(avg10(x))));
    hd.appendChild(esq); hd.appendChild(dir); ev.appendChild(hd);
    var ns=el("div","ns"); x.notas.forEach(function(v,i){ var c=el("i",cls(v),String(v)); c.title=(i+1)+". "+CRIT[i]; ns.appendChild(c); }); ev.appendChild(ns);
    if(x.com) ev.appendChild(el("p","cm","“"+x.com+"”"));
    dt.appendChild(ev);
  });
}

function controles(dt, p, tanda){
  dt.appendChild(el("div","sh","Ajustes de la "+tanda+"ª tanda (solo tú)"));
  var box=el("div","adm");
  var temMV = p.aj.some(function(a){ return /mejor vuelta/i.test(a.motivo); });
  var temQ = p.aj.some(function(a){ return /ca[ií]da|queda/i.test(a.motivo); });
  var acoes=[["caida", tanda<=3 ? "Caída −1" : "Caída −2","dn"]];
  if(temQ) acoes.push(["quitar_caida","Quitar caída",""]);
  acoes.push(temMV ? ["quitar_mejor_vuelta","Quitar mejor vuelta",""] : ["mejor_vuelta","Mejor vuelta +1","up"]);
  acoes.forEach(function(a){
    var b=el("button",a[2],a[1]); b.type="button"; var armado=false, tm=null;
    b.addEventListener("click", function(ev){
      ev.stopPropagation();
      if(!armado){ armado=true; b.className="conf"; b.textContent="¿Confirmar? "+a[1]; tm=setTimeout(function(){ armado=false; b.className=a[2]; b.textContent=a[1]; }, 5000); return; }
      clearTimeout(tm); b.disabled=true; b.textContent="Guardando…";
      fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({a:"ajuste",t:T,op:a[0],saida:tanda,colete:p.c})})
        .then(function(r){ return r.json(); }).then(function(j){
          if(!j.ok){ b.disabled=false; armado=false; b.className=a[2]; b.textContent=a[1]; $("err").textContent = j.erro==="ocupado" ? "Sistema ocupado. Inténtalo de nuevo." : "No se pudo guardar el ajuste. Inténtalo de nuevo."; return; }
          carregar();
        }).catch(function(){ b.disabled=false; armado=false; b.className=a[2]; b.textContent=a[1]; $("err").textContent="Sin conexión. Inténtalo de nuevo."; });
    });
    box.appendChild(b);
  });
  dt.appendChild(box);
}

function carregar(){
  if(carregando) return; carregando=true; $("act").textContent="…"; $("err").textContent="";
  fetch(API+"?a=resultados&t="+encodeURIComponent(T),{cache:"no-store"}).then(function(r){ return r.json(); }).then(function(d){
    carregando=false; $("act").textContent="Actualizar";
    if(!d.ok){ $("err").textContent = d.erro==="link" ? "Este enlace no es válido para ver los resultados." : "No se pudieron leer los resultados. Toca Actualizar."; if(d.erro==="link"){ store(null); $("st").textContent="—"; } return; }
    pintar(d);
  }).catch(function(){ carregando=false; $("act").textContent="Actualizar"; $("err").textContent="Sin conexión. Toca Actualizar."; });
}
$("act").addEventListener("click", carregar);
if(!T){ $("st").textContent="—"; $("err").textContent="Abre esta página con tu enlace personal."; return; }
carregar();
setInterval(function(){ if(!document.hidden) carregar(); }, 60000);
document.addEventListener("visibilitychange", function(){ if(!document.hidden) carregar(); });
})();
</script>
