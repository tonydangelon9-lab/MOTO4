<style>
  @font-face{font-family:"MGP Display";src:url("05-MGP-FONT/MGPDisplay-Bold.ttf") format("truetype");font-weight:700;font-display:swap}

  :root{--white:#fff;--purple:#D63DFC;--violet:#C604F7;--pink:#E37BFD;--bg:#000;--surface:#0e0410;--surface2:#160518;

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

  body{background:var(--bg);color:var(--white);font-family:var(--body);line-height:1.55;overflow-x:hidden}

  nav .wrap{display:flex;align-items:center;justify-content:space-between;height:78px;gap:18px}

  .navlinks{display:flex;gap:26px;align-items:center}

  .navlinks a.lnk:hover,.navlinks a.lnk.active{color:#fff}
  .navlinks a.lnk.active{position:relative}
  .navlinks a.lnk.active::after{content:"";position:absolute;left:0;right:0;bottom:-6px;height:2px;background:var(--grad)}

  .nartbody{padding:22px 26px 30px}
  .nartbody h2{font-family:"MGP Display Exp",sans-serif;text-transform:uppercase;font-weight:700;font-size:clamp(20px,4vw,28px);line-height:1.12;margin:8px 0 14px;color:#fff}

  .smarquee:hover .strack{animation-play-state:paused}
  footer .sp-row.unica{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:26px 56px;width:100%}

  @media(max-width:560px){footer .sp-row.unica{gap:16px 28px}

  </style>

<script>var b=document.getElementById("burger"),m=document.getElementById("menu");if(b){b.addEventListener("click",function(){m.classList.toggle("open");});m.querySelectorAll("a").forEach(function(a){a.addEventListener("click",function(){m.classList.remove("open");});});}</script>

<script src="noticias-data.js"></script>
<script>
(function(){
  var LOGO = "00-LOGOTIPOS/Moto4_Latin_Cup_2_Line_Purple_Grad_White_RGB.png";
  var MESES = ["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
  var news = (window.NOTICIAS || []).slice().sort(function(a,b){ return b.fecha.localeCompare(a.fecha); });

  function fmt(f){ var p=f.split("-"); return p[2]+" "+MESES[parseInt(p[1],10)-1]+" "+p[0]; }
  function esNueva(f){ var d=(Date.now()-new Date(f+"T12:00:00").getTime())/86400000; return d>=0 && d<=14; }
  function imgHTML(n){
    if(n.imagen){ return '<img src="'+n.imagen+'" alt="" loading="lazy">'; }
    return '<div class="nlogo"><img src="'+LOGO+'" alt="Moto4 Latin Cup"></div>';
  }

  var cats=["Todas"];
  news.forEach(function(n){ if(cats.indexOf(n.categoria)<0) cats.push(n.categoria); });
  var filtros=document.getElementById("nfiltros"), actual="Todas";
  cats.forEach(function(c,i){
    var b=document.createElement("button"); b.textContent=c;
    if(i===0) b.className="act";
    b.onclick=function(){
      actual=c;
      filtros.querySelectorAll("button").forEach(function(x){x.className="";});
      b.className="act"; render();
    };
    filtros.appendChild(b);
  });

  var grid=document.getElementById("ngrid"), msg=document.getElementById("nmsg");
  function render(){
    grid.innerHTML="";
    var lista=news.filter(function(n){ return actual==="Todas"||n.categoria===actual; });
    msg.style.display=lista.length?"none":"block";
    lista.forEach(function(n){
      var card=document.createElement("article"); card.className="ncard";
      card.innerHTML=(esNueva(n.fecha)?'<span class="nnew">NEW</span>':"")+
        '<div class="nimg">'+imgHTML(n)+'</div>'+
        '<div class="nbody"><div class="nmeta"><span class="ncat">'+n.categoria+'</span><span class="nfecha">'+fmt(n.fecha)+'</span></div>'+
        '<h2>'+n.titulo+'</h2><p>'+n.bajada+'</p></div>';
      card.onclick=function(){ abrir(n); };
      grid.appendChild(card);
    });
    if(window.m4Apply) window.m4Apply(grid);
  }

  var bk=document.getElementById("nbk");
  function abrir(n){
    document.getElementById("nartimg").innerHTML=imgHTML(n);
    document.getElementById("nartcat").textContent=n.categoria;
    document.getElementById("nartfecha").textContent=fmt(n.fecha);
    document.getElementById("narttit").textContent=n.titulo;
    document.getElementById("nartcuerpo").innerHTML=n.cuerpo;
    bk.classList.add("open"); document.body.style.overflow="hidden";
    if(window.m4Apply) window.m4Apply(bk);
  }
  function cerrar(){ bk.classList.remove("open"); document.body.style.overflow=""; }
  document.getElementById("nx").onclick=cerrar;
  bk.addEventListener("click",function(e){ if(e.target===bk) cerrar(); });
  document.addEventListener("keydown",function(e){ if(e.key==="Escape") cerrar(); });

  render();
})();
</script>
