:root{ --bg:#0B0011; --panel:#2A0136; --panel2:#3A1440; --primary:#C604F7; --light:#E37BFD; --pale:#E9DAF5; --gray:#C9A8DB; }
*{box-sizing:border-box; margin:0; padding:0;}
body{ background:var(--bg); color:#fff; font-family:'MGP Text', Arial, sans-serif; min-height:100vh; }
body::before{ content:''; position:fixed; inset:0; background:
 radial-gradient(1200px 500px at 85% -10%, rgba(198,4,247,.18), transparent 60%),
 radial-gradient(900px 500px at -10% 110%, rgba(198,4,247,.14), transparent 60%); pointer-events:none;}
.wrap{ max-width:1080px; margin:0 auto; padding:42px 24px; position:relative;}
.langbar{ position:absolute; top:18px; right:24px; display:flex; gap:6px; z-index:5;}
.backlnk{ position:absolute; top:18px; left:24px; z-index:5; color:var(--gray); text-decoration:none; font-family:'MGP Display'; font-size:11px; letter-spacing:1px; border:1px solid #4a2158; border-radius:6px; padding:7px 12px;}
.backlnk:hover{ color:#fff; border-color:var(--primary);}
.langbar button{ background:transparent; border:1px solid #4a2158; color:var(--gray); border-radius:6px; padding:6px 10px; font-family:'MGP Display'; font-size:11px; letter-spacing:1px; cursor:pointer;}
.langbar button.on{ background:var(--primary); border-color:var(--primary); color:#fff;}
.logo{ display:block; margin:0 auto 8px; height:84px; }
.kicker{ text-align:center; color:var(--light); font-size:12px; letter-spacing:4px; font-weight:bold; margin-top:18px;}
h1{ font-family:'MGP Display'; text-align:center; font-size:clamp(19px,5.6vw,44px); letter-spacing:2px; margin:6px 0 4px; overflow-wrap:anywhere;}
.sub{ text-align:center; color:var(--gray); font-size:14px; margin-bottom:40px;}
.grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:20px;}
.card{ background:var(--panel); border:1px solid rgba(198,4,247,.35); border-radius:14px; padding:26px 24px; transition:transform .15s, border-color .15s;}
.card:hover{ transform:translateY(-3px); border-color:var(--primary);}
.card .tag{ font-size:10.5px; letter-spacing:3px; color:var(--light); font-weight:bold;}
.card h2{ font-family:'MGP Display'; font-size:18px; letter-spacing:1px; margin:8px 0 8px;}
.card p{ color:var(--pale); font-size:13px; line-height:1.5; min-height:58px;}
.lock{ float:right; opacity:.85; font-size:18px;}
.row{ display:flex; gap:8px; margin-top:16px;}
.row input{ flex:1; min-width:0; background:#14001d; border:1px solid #4a2158; border-radius:8px; color:#fff; padding:11px 12px; font-size:14px; letter-spacing:2px; font-family:'MGP Text',Arial; text-transform:uppercase;}
.row input:focus{ outline:none; border-color:var(--primary);}
.row button{ background:var(--primary); color:#fff; border:none; border-radius:8px; padding:0 18px; font-family:'MGP Display'; font-size:13px; letter-spacing:1px; cursor:pointer;}
.row button:hover{ filter:brightness(1.15);}
.err{ color:#ff7a9c; font-size:12px; margin-top:8px; height:14px;}
.shake{ animation:sh .35s;}
@keyframes sh{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
.demo{ text-align:center; margin-top:36px; color:#7d6b8a; font-size:11.5px; letter-spacing:1px;}
.demo b{color:var(--gray)}
footer{ text-align:center; color:#5d4b6a; font-size:11px; margin-top:26px; letter-spacing:2px;}
#viewer{ display:none; position:fixed; inset:0; background:#000; z-index:50; }
#viewer.open{ display:flex; flex-direction:column;}
.vtop{ display:flex; align-items:center; justify-content:space-between; padding:12px 18px; background:#0B0011; border-bottom:1px solid #2A0136; gap:12px; flex-wrap:wrap;}
.vtitle{ font-family:'MGP Display'; font-size:13px; letter-spacing:2px; color:var(--light);}
.vbtns{ display:flex; gap:10px; align-items:center;}
.vbtns button{ background:var(--panel); color:var(--pale); border:1px solid #4a2158; border-radius:7px; padding:7px 14px; font-family:'MGP Text',Arial; font-size:12px; cursor:pointer;}
.vbtns button:hover{ border-color:var(--primary); color:#fff;}
.vbtns .vlang{ font-family:'MGP Display'; letter-spacing:1px; font-size:11px; padding:7px 10px;}
.vbtns .vlang.on{ background:var(--primary); border-color:var(--primary); color:#fff;}
.stage{ flex:1; display:flex; align-items:center; justify-content:center; position:relative; padding:16px; min-height:0;}
.stage img{ max-width:100%; max-height:100%; border-radius:6px; box-shadow:0 8px 50px rgba(198,4,247,.25);}
.nav{ position:absolute; top:50%; transform:translateY(-50%); background:rgba(42,1,54,.85); border:1px solid #4a2158; color:#fff; font-size:22px; width:46px; height:46px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; user-select:none;}
.nav:hover{ background:var(--primary);}
#prev{ left:14px;} #next{ right:14px;}
.vbottom{ text-align:center; padding:10px; color:var(--gray); font-size:12.5px; letter-spacing:2px; background:#0B0011; border-top:1px solid #2A0136;}
@media (max-width:640px){ .logo{height:60px} .langbar{position:static; justify-content:center; margin-bottom:10px;} .backlnk{position:static; display:inline-block; margin-bottom:10px;} }
html,body{overflow-x:hidden}
</style>
</head>

let lang='es', deckLang='es', cur=0, activo=null, gateOK=false;
const GATE_HASH='5313e5bf17148de844ff74be3663d47c6e361ca469b30a36337701233c89a15e';
async function sha256(s){
  const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(d)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function tryGate(){
  const u=UI[lang];
  const val=document.getElementById('gatein').value.trim().toUpperCase();
  const hv=await sha256(val);
  const err=document.getElementById('gateerr');
  if(hv!==GATE_HASH){ err.textContent=u.wrong; const c=err.closest('.card'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); return; }
  gateOK=true;
  document.getElementById('gate').style.display='none';
  document.getElementById('cards').style.display='';
}
function setLang(l){ lang=l; deckLang=l; renderHub(); document.querySelectorAll('.langbar button').forEach(b=>b.classList.toggle('on', b.dataset.l===l)); }
function renderHub(){
  const u=UI[lang];
  document.getElementById('t-kicker').textContent=u.kicker;
  document.getElementById('t-title').textContent=u.title;
  document.getElementById('t-sub').textContent=u.sub;
  document.getElementById('t-demo').innerHTML=u.demo;
  document.getElementById('t-gate').textContent=u.gate;
  document.getElementById('backhome').textContent=u.back;
  document.getElementById('t-gatebtn').textContent=u.gatebtn;
  document.getElementById('gatein').placeholder=u.placeholder;
  document.getElementById('gate').style.display = gateOK ? 'none' : '';
  document.getElementById('cards').style.display = gateOK ? '' : 'none';
  const cards=document.getElementById('cards'); cards.innerHTML='';
  PRESENTACIONES.forEach((p,idx)=>{
    const d=document.createElement('div'); d.className='card';
    d.innerHTML=`<span class="lock">🔒</span><span class="tag">${p.tag[lang]}</span><h2>${p.nombre[lang]}</h2><p>${p.desc[lang]}</p>
    <div class="row"><input type="password" placeholder="${u.placeholder}" id="in${idx}" onkeydown="if(event.key==='Enter')tryOpen(${idx})"><button onclick="tryOpen(${idx})">${u.enter}</button></div>
    <div class="err" id="err${idx}"></div>`;
    cards.appendChild(d);
  });
}
async function tryOpen(idx){
  const u=UI[lang], p=PRESENTACIONES[idx];
  const val=document.getElementById('in'+idx).value.trim().toUpperCase();
  const err=document.getElementById('err'+idx);
  const hv=await sha256(val);
  if(hv!==p.hash){ err.style.color='#ff7a9c'; err.textContent=u.wrong; const c=err.closest('.card'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); return; }
  err.textContent='';
  if(p.link){
    try{ if(p.id==='moto4') sessionStorage.setItem('m4pres','1'); if(p.id==='honda') sessionStorage.setItem('m4tj','1'); if(p.id==='socios') sessionStorage.setItem('m4soc','1'); if(p.id==='inst') sessionStorage.setItem('m4inst','1'); }catch(e){}
    window.location.href = p.link; return;
  }
  if(!p.slides){ err.textContent=u.prep; err.style.color='#8be89b'; return; }
  activo=p; cur=0; deckLang=lang;
  document.getElementById('vtitle').textContent=p.nombre[lang];
  document.getElementById('t-fs').textContent=u.fs;
  document.getElementById('t-exit').textContent=u.exit;
  document.getElementById('t-keys').textContent=u.keys;
  document.getElementById('viewer').classList.add('open');
  renderSlide();
}
function setDeckLang(l){ if(!activo) return; deckLang=l; renderSlide(); }
function renderSlide(){
  const arr=activo.slides[deckLang];
  document.getElementById('slideimg').src=arr[cur];
  document.getElementById('counter').textContent=(cur+1)+' / '+arr.length;
  document.querySelectorAll('.vlang').forEach(b=>b.classList.toggle('on', b.dataset.l===deckLang));
}
function go(d){ if(!activo) return; const n=activo.slides[deckLang].length; cur=Math.min(Math.max(cur+d,0),n-1); renderSlide(); }
function closeViewer(){ document.getElementById('viewer').classList.remove('open'); if(document.fullscreenElement) document.exitFullscreen(); }
function fs(){ const v=document.getElementById('viewer'); if(!document.fullscreenElement) v.requestFullscreen(); else document.exitFullscreen(); }
document.addEventListener('keydown',e=>{
  if(!document.getElementById('viewer').classList.contains('open')) return;
  if(e.key==='ArrowRight') go(1); if(e.key==='ArrowLeft') go(-1); if(e.key==='Escape') closeViewer();
});
renderHub();
</script>
