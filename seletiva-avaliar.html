pite las mismas referencias vuelta tras vuelta.", "gpt": "Pilotagem", "ges": "Pilotaje"}, {"pt": "9. Aprendizado", "es": "9. Aprendizaje", "dpt": "Aplica a correção do treinador de uma bateria para a outra.", "des": "Aplica la corrección del entrenador de una batería a la siguiente.", "gpt": "Potencial", "ges": "Potencial"}, {"pt": "10. Conduta na pista", "es": "10. Conducta en pista", "dpt": "Respeita bandeiras, ultrapassa de forma limpa, cuida dos outros.", "des": "Respeta banderas, adelanta de forma limpia, cuida a los demás.", "gpt": "Potencial", "ges": "Potencial"}];
var TX = {
 pt:{chip:"Avaliação",ola:"Juiz ",sub:"Escolha a saída, digite o número do piloto (o número da camiseta) e toque as notas.",aviso:"Link pessoal. Dados de menores: não compartilhe o link nem tire print.",sai:"Saída",col:"Número do piloto (camiseta)",ph:"Nº",buscar:"Ver",lista:"Pilotos credenciados",vazio:"Ainda não há pilotos credenciados.",
     idade:"Idade",uf:"Estado",alt:"Altura",peso:"Peso",exp:"Experiência",anos:" anos",melhor:"Melhor resultado",motos:"Motos",no:"Nova Odessa · melhor volta",lic:"Licença",
     ja:"Você já avaliou este piloto nesta saída. Se salvar de novo, vale a nova nota.",jaOutras:"Já avaliado nas saídas: ",rec:"Recomenda para as 2 vagas?",recs:["Sim","Não","Dúvida"],com:"Comentário (opcional)",
     salvar:"Salvar avaliação",falta:"Escolha a saída",faltaP:"Escolha o piloto",notas:" notas",faltaR:"Falta a recomendação",enviando:"Salvando…",ok:"Salvo · piloto ",okS:" · saída ",
     e_link:"Link inválido. Peça o seu link ao Antonio.",e_colete:"Esse número não está credenciado. Confira o número da camiseta ou avise o Antonio.",e_rede:"Sem conexão. Tente de novo.",e_servidor:"Erro no servidor. Tente de novo em alguns segundos.",e_ocupado:"Sistema ocupado. Tente de novo.",e_dados:"Faltam dados. Confira as notas e a recomendação."},
 es:{chip:"Evaluación",ola:"Juez ",sub:"Elige la salida, escribe el número del piloto (el número de la polera) y toca las notas.",aviso:"Enlace personal. Datos de menores: no compartas el enlace ni hagas capturas.",sai:"Salida",col:"Número del piloto (polera)",ph:"Nº",buscar:"Ver",lista:"Pilotos acreditados",vazio:"Todavía no hay pilotos acreditados.",
     idade:"Edad",uf:"Estado",alt:"Altura",peso:"Peso",exp:"Experiencia",anos:" años",melhor:"Mejor resultado",motos:"Motos",no:"Nova Odessa · mejor vuelta",lic:"Licencia",
     ja:"Ya evaluaste a este piloto en esta salida. Si guardas de nuevo, vale la nueva nota.",jaOutras:"Ya evaluado en las salidas: ",rec:"¿Lo recomiendas para los 2 cupos?",recs:["Sí","No","Duda"],com:"Comentario (opcional)",
     salvar:"Guardar evaluación",falta:"Elige la salida",faltaP:"Elige el piloto",notas:" notas",faltaR:"Falta la recomendación",enviando:"Guardando…",ok:"Guardado · piloto ",okS:" · salida ",
     e_link:"Enlace inválido. Pídele tu enlace a Antonio.",e_colete:"Ese número no está acreditado. Revisa el número de la polera.",e_rede:"Sin conexión. Inténtalo de nuevo.",e_servidor:"Error del servidor. Inténtalo de nuevo en unos segundos.",e_ocupado:"Sistema ocupado. Inténtalo de nuevo.",e_dados:"Faltan datos. Revisa las notas y la recomendación."}
};
var REC = ["sim","nao","duvida"];
var $ = function(id){return document.getElementById(id)};
function store(k,v){try{ if(v===undefined) return localStorage.getItem("sel27_"+k); if(v===null) localStorage.removeItem("sel27_"+k); else localStorage.setItem("sel27_"+k,v);}catch(x){} return null}
var m = /(?:^|[#&])t=([A-Za-z0-9_-]{16,64})/.exec(location.hash||"");
var T = m ? m[1] : (store("t")||"");
if(m){ store("t",T); try{history.replaceState(null,"",location.pathname+location.search+"#t="+T)}catch(x){} }
var L = TX.pt, st = {saida:0, piloto:null, notas:[], rec:"", lista:[]};

function api(q){ return fetch(API+"?"+q+"&t="+encodeURIComponent(T),{cache:"no-store"}).then(function(r){return r.json()}); }
function txt(el,s){ el.textContent = s; }
function toast(s){ var t=$("toast"); txt(t,s); t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(function(){t.hidden=true},2600); }
function errMsg(code){ return L["e_"+code] || L.e_servidor; }

function montar(){
  txt($("chip"),L.chip); txt($("sub"),L.sub); txt($("aviso"),L.aviso); txt($("lSai"),L.sai); txt($("lCol"),L.col); $("col").placeholder=L.ph; txt($("buscar"),L.buscar);
  txt($("lLista"),L.lista); txt($("lRec"),L.rec); txt($("lCom"),L.com);
  var s=$("sai"); s.setAttribute("aria-label",L.sai);
  for(var i=1;i<=4;i++){ var b=document.createElement("button"); b.type="button"; b.textContent=i+"ª"; b.setAttribute("data-s",i); b.setAttribute("aria-pressed","false");
    b.addEventListener("click",function(){ st.saida=+this.getAttribute("data-s"); pintarSai(); pintarLista(); pintarJa(); estado(); }); s.appendChild(b); }
  var cw=$("crits"), g="";
  CRIT.forEach(function(c,i){
    var grp = L===TX.es ? c.ges : c.gpt;
    if(grp!==g){ g=grp; var h=document.createElement("div"); h.className="grp"; h.textContent=g; cw.appendChild(h); }
    var d=document.createElement("div"); d.className="crb"; d.id="cr"+i;
    var h4=document.createElement("h4"); h4.textContent = L===TX.es ? c.es : c.pt; d.appendChild(h4);
    var p=document.createElement("p"); p.textContent = L===TX.es ? c.des : c.dpt; d.appendChild(p);
    var sc=document.createElement("div"); sc.className="sc"; sc.setAttribute("role","group"); sc.setAttribute("aria-label",h4.textContent);
    for(var v=1;v<=10;v++){ var b=document.createElement("button"); b.type="button"; b.textContent=v; b.className=v<=3?"l":(v<=6?"m":(v<=8?"h":"")); b.setAttribute("aria-pressed","false");
      b.setAttribute("data-i",i); b.setAttribute("data-v",v);
      b.addEventListener("click",function(){ var i=+this.getAttribute("data-i"); st.notas[i]=+this.getAttribute("data-v"); pintarNota(i); estado(); }); sc.appendChild(b); }
    d.appendChild(sc); cw.appendChild(d);
  });
  var r=$("rec"); r.setAttribute("aria-label",L.rec);
  REC.forEach(function(k,i){ var b=document.createElement("button"); b.type="button"; b.textContent=L.recs[i]; b.setAttribute("data-r",k); b.setAttribute("aria-pressed","false");
    b.addEventListener("click",function(){ st.rec=this.getAttribute("data-r"); pintarRec(); estado(); }); r.appendChild(b); });
  $("buscar").addEventListener("click",function(){ buscar($("col").value); });
  $("col").addEventListener("keydown",function(e){ if(e.key==="Enter") buscar($("col").value); });
  $("salvar").addEventListener("click",salvar);
}
function pintarSai(){ [].forEach.call($("sai").children,function(b){ b.setAttribute("aria-pressed", +b.getAttribute("data-s")===st.saida ? "true":"false"); }); }
function pintarNota(i){ [].forEach.call($("cr"+i).querySelectorAll("button"),function(b){ b.setAttribute("aria-pressed", +b.getAttribute("data-v")===st.notas[i] ? "true":"false"); }); $("cr"+i).classList.toggle("fx", !!st.notas[i]); }
function pintarRec(){ [].forEach.call($("rec").children,function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-r")===st.rec ? "true":"false"); }); }
function pintarLista(){
  var c=$("chips"); c.innerHTML="";
  if(!st.lista.length){ var p=document.createElement("p"); p.className="muted"; p.textContent=L.vazio; c.appendChild(p); return; }
  st.lista.slice().sort(function(a,b){return a.colete-b.colete}).forEach(function(x){
    var b=document.createElement("button"); b.type="button"; b.className="chip"+(st.saida && x.feitas.indexOf(st.saida)!==-1 ? " done":"");
    b.setAttribute("aria-pressed", st.piloto && st.piloto.colete===x.colete ? "true":"false");
    var n=document.createElement("b"); n.textContent=x.colete; var s=document.createElement("span"); s.textContent=x.nome.split(" ")[0];
    b.appendChild(n); b.appendChild(s); b.addEventListener("click",function(){ $("col").value=x.colete; buscar(x.colete); }); c.appendChild(b);
  });
}
function pintarJa(){
  var p=st.piloto, el=$("fJa"); if(!p){ el.hidden=true; return; }
  if(st.saida && p.feitas.indexOf(st.saida)!==-1){ txt(el,L.ja); el.hidden=false; }
  else if(p.feitas.length){ txt(el,L.jaOutras+p.feitas.slice().sort().map(function(s){return s+"ª"}).join(", ")); el.hidden=false; }
  else el.hidden=true;
}
function fato(lbl,val){ if(val===""||val===null||val===undefined) return; var d=document.createElement("div"); var b=document.createElement("b"); b.textContent=lbl; var s=document.createElement("span"); s.textContent=val; d.appendChild(b); d.appendChild(s); $("facts").appendChild(d); }
function limparFicha(){ st.piloto=null; st.notas=[]; st.rec=""; $("com").value=""; for(var i=0;i<CRIT.length;i++) pintarNota(i); pintarRec(); $("ficha").hidden=true; }
function buscar(v){
  var c=parseInt(String(v).replace(/\D/g,""),10); txt($("erroCol"),"");
  if(!(c>=1&&c<=98)) { txt($("erroCol"),errMsg("colete")); return; }
  limparFicha(); txt($("buscar"),"…");
  api("a=piloto&n="+c).then(function(j){
    txt($("buscar"),L.buscar);
    if(!j.ok){ txt($("erroCol"),errMsg(j.erro)); estado(); return; }
    var p=j.piloto; st.piloto=p;
    txt($("fN"),p.colete); txt($("fNome"),p.nome);
    txt($("fSub"),[p.idade!==""?p.idade+L.anos:"", p.uf].filter(Boolean).join(" · "));
    $("facts").innerHTML="";
    fato(L.alt, p.altura!==""?p.altura+" cm":""); fato(L.peso, p.peso!==""?p.peso+" kg":"");
    fato(L.exp, p.exp!==""?p.exp+L.anos:""); fato(L.lic, p.licenca);
    fato(L.no, [p.novaOdessa, p.voltaNO].filter(Boolean).join(" · ")); fato(L.motos, p.motos); fato(L.melhor, p.melhor);
    pintarJa(); $("ficha").hidden=false; pintarLista(); estado();
    $("ficha").scrollIntoView({behavior:"smooth",block:"start"});
  }).catch(function(){ txt($("buscar"),L.buscar); txt($("erroCol"),L.e_rede); });
}
function estado(){
  var n=st.notas.filter(Boolean).length, b=$("salvar"), s=$("st");
  $("bar").hidden=false;
  if(!st.saida){ txt(s,L.falta); b.disabled=true; txt(b,L.salvar); return; }
  if(!st.piloto){ txt(s,L.faltaP); b.disabled=true; txt(b,L.salvar); return; }
  txt(s, n+"/10"+L.notas+(n===10 && !st.rec ? " · "+L.faltaR : ""));
  b.disabled = !(n===10 && st.rec); txt(b, L.salvar+" · "+st.piloto.colete);
}
function salvar(){
  var b=$("salvar"); if(b.disabled) return; b.disabled=true; txt(b,L.enviando);
  var dados={t:T, colete:st.piloto.colete, saida:st.saida, notas:st.notas.slice(0,10), rec:st.rec, com:$("com").value};
  fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(dados)})
  .then(function(r){return r.json()}).then(function(j){
    if(!j.ok){ toast(errMsg(j.erro)); estado(); return; }
    toast(L.ok+j.colete+L.okS+j.saida+"ª");
    st.lista.forEach(function(x){ if(x.colete===j.colete && x.feitas.indexOf(j.saida)===-1) x.feitas.push(j.saida); });
    limparFicha(); $("col").value=""; pintarLista(); estado(); window.scrollTo({top:0,behavior:"smooth"});
  }).catch(function(){ toast(L.e_rede); estado(); });
}
function carregarLista(){ api("a=lista").then(function(j){ if(j.ok){ st.lista=j.pilotos; pintarLista(); } }).catch(function(){}); }

if(!T){ txt($("ola"),"—"); txt($("erroTop"),TX.pt.e_link); return; }
api("a=eu").then(function(j){
  if(!j.ok){ txt($("ola"),"—"); txt($("erroTop"),TX.pt.e_link); store("t",null); return; }
  L = TX[j.lang] || TX.pt; document.documentElement.lang = j.lang==="es"?"es":"pt-BR";
  txt($("ola"), L.ola+j.nome.split(" ")[0]); montar(); $("app").hidden=false; estado(); carregarLista();
  setInterval(function(){ if(!document.hidden) carregarLista(); }, 60000);
}).catch(function(){ txt($("ola"),"—"); txt($("erroTop"),TX.pt.e_rede); });
})();
</script>
</body>
